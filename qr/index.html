<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .centered {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      animation: fadeIn 1s ease-in;
      padding: 20px;
      text-align: center;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    h1 {
      color: #fff;
      font-family: 'Arial', sans-serif;
      font-size: clamp(2rem, 8vw, 3.5rem);
      margin-bottom: 1rem;
      text-shadow: 0 0 20px rgba(255,255,255,0.5);
      animation: glow 2s ease-in-out infinite alternate;
      width: 100%;
    }
    @keyframes glow {
      from { text-shadow: 0 0 20px rgba(255,255,255,0.5), 0 0 30px rgba(255,255,255,0.3); }
      to { text-shadow: 0 0 30px rgba(255,255,255,0.8), 0 0 40px rgba(255,255,255,0.5); }
    }
    .subtitle {
      color: rgba(255,255,255,0.9);
      font-family: 'Arial', sans-serif;
      font-size: clamp(1rem, 3vw, 1.2rem);
      margin-bottom: 2rem;
      width: 100%;
      max-width: 600px;
    }
    .button-wrapper {
      position: relative;
      display: inline-block;
    }
    .go-btn {
      font-size: clamp(1.5rem, 5vw, 3rem);
      padding: clamp(0.8rem, 2vw, 1.5rem) clamp(2rem, 6vw, 4rem);
      border: none;
      border-radius: 2rem;
      background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(245, 87, 108, 0.4);
      transition: all 0.3s ease;
      font-weight: bold;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      animation: pulse 2s ease-in-out infinite;
      display: inline-block;
      white-space: nowrap;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .go-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    .go-btn:hover::before {
      width: 300px;
      height: 300px;
    }
    .go-btn:hover {
      background: linear-gradient(90deg, #f5576c 0%, #f093fb 100%);
      transform: scale(1.1);
      box-shadow: 0 12px 48px rgba(245, 87, 108, 0.6);
      animation: none;
    }
    .go-btn:active {
      transform: scale(0.95);
    }
    .go-btn .btn-text {
      position: relative;
      z-index: 1;
    }
    .sparkle {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      top: 0;
      left: 0;
    }
    .sparkle::before,
    .sparkle::after {
      content: '✨';
      position: absolute;
      font-size: clamp(1.5rem, 4vw, 2rem);
      animation: sparkleFloat 3s ease-in-out infinite;
      opacity: 0.7;
      top: 50%;
      transform: translateY(-50%);
    }
    .sparkle::before {
      left: -50px;
      animation-delay: 0s;
    }
    .sparkle::after {
      right: -50px;
      animation-delay: 1.5s;
    }
    @keyframes sparkleFloat {
      0%, 100% { transform: translateY(-50%) translateY(0px); }
      50% { transform: translateY(-50%) translateY(-20px); }
    }
    .hidden {
      display: none !important;
    }
    .video-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: fixed;
      top: 0;
      left: 0;
    }
    #player {
      width: 100%;
      height: 100%;
    }
    
    @media (max-width: 768px) {
      .sparkle::before,
      .sparkle::after {
        font-size: 1.5rem;
      }
      .sparkle::before {
        left: -40px;
      }
      .sparkle::after {
        right: -40px;
      }
    }
  </style>
</head>
<body>
  <div class="centered" id="startScreen">
    <h1>🎉 Congratulations! 🎉</h1>
    <p class="subtitle">You've won an exclusive prize!<br>Click below to claim it now!</p>
    <div class="button-wrapper">
      <span class="sparkle"></span>
      <button class="go-btn" id="goBtn">
        <span class="btn-text">Claim Prize!</span>
      </button>
    </div>
  </div>
  <div class="video-container hidden" id="videoContainer">
    <div id="player"></div>
  </div>
  
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var player;
    function onYouTubeIframeAPIReady() {
      // API is ready but we don't create player yet
    }
    
    document.getElementById('goBtn').addEventListener('click', function() {
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('videoContainer').classList.remove('hidden');
      
      // Create player after user interaction
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: 'dQw4w9WgXcQ',
        playerVars: {
          'autoplay': 1,
          'controls': 1,
          'rel': 0,
          'modestbranding': 1,
          'fs': 1
        },
        events: {
          'onReady': onPlayerReady
        }
      });
    });
    
    function onPlayerReady(event) {
      event.target.playVideo();
    }
  </script>
</body>
</html>
