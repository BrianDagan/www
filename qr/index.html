<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0505;
      font-family: 'Arial', sans-serif;
    }

    /* ---------- Stage layers ---------- */
    .video-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 1;
    }
    #player {
      width: 100%;
      height: 100%;
    }
    /* Diabolical: an invisible layer that swallows every click and hover,
       so the revealed video can't be paused and its controls never appear. */
    .block-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: transparent;
      pointer-events: none;
    }
    .block-overlay.active {
      pointer-events: auto;
    }

    /* ---------- Theater curtains ---------- */
    .curtains {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .valance {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background:
        repeating-linear-gradient(90deg,
          #5a0c0c 0px, #7e1414 26px, #9c1d1d 52px, #7e1414 78px, #5a0c0c 104px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
      border-bottom: 4px solid #d9a441;
      z-index: 3;
      will-change: transform;
      /* Starts after the side curtains, finishes at the same moment (2s + 2.75s = 4.75s) */
      transition: transform 2.75s cubic-bezier(0.55, 0, 0.3, 1) 2s;
    }
    .valance::after {
      content: '';
      position: absolute;
      bottom: -22px;
      left: 0;
      width: 100%;
      height: 22px;
      background:
        radial-gradient(circle at 20px -2px, #7e1414 16px, transparent 17px) repeat-x;
      background-size: 40px 22px;
    }
    .curtain {
      position: absolute;
      top: 0;
      height: 100%;
      width: 52%;
      background:
        repeating-linear-gradient(90deg,
          #4d0a0a 0px,
          #6e1010 22px,
          #9a1d1d 44px,
          #b32525 60px,
          #9a1d1d 76px,
          #6e1010 98px,
          #4d0a0a 120px);
      box-shadow: inset 0 0 120px rgba(0,0,0,0.7);
      transition: transform 4.75s cubic-bezier(0.7, 0, 0.25, 1);
      will-change: transform;
    }
    .curtain::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 30%,
        rgba(0,0,0,0) 70%, rgba(0,0,0,0.45) 100%);
    }
    .curtain-left  { left: 0;  transform-origin: left center; }
    .curtain-right { right: 0; transform-origin: right center; }
    .curtains.open .curtain-left  { transform: translateX(-102%); }
    .curtains.open .curtain-right { transform: translateX(102%); }
    .curtains.open .valance       { transform: translateY(-160%); }

    /* ---------- Start screen ---------- */
    .start-screen {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.5rem, 6vw, 3.5rem);
      padding: 20px;
      transition: opacity 0.9s ease;
    }
    .start-screen.gone {
      opacity: 0;
      pointer-events: none;
    }

    /* ---------- Arcade button + mounting ---------- */
    .button-rig {
      position: relative;
      width: clamp(170px, 42vw, 280px);
      height: clamp(170px, 42vw, 280px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* The mounting plate the button is bolted to */
    .mount {
      position: absolute;
      width: 86%;
      height: 86%;
      border-radius: 26%;
      background:
        radial-gradient(circle at 50% 40%, #2c2c30 0%, #161618 70%, #0c0c0d 100%);
      box-shadow: 0 14px 30px rgba(0,0,0,0.6), inset 0 3px 8px rgba(255,255,255,0.08);
      transition: opacity 0.6s ease;
    }
    .mount::before {
      /* dark socket where the button sits */
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 76%; height: 76%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, #000 40%, #1a1a1c 100%);
      box-shadow: inset 0 6px 14px rgba(0,0,0,0.9);
    }
    .bolt {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #9a9aa2, #3a3a40 70%, #1c1c20);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.4);
    }
    .bolt.tl { top: 9%;  left: 9%; }
    .bolt.tr { top: 9%;  right: 9%; }
    .bolt.bl { bottom: 9%; left: 9%; }
    .bolt.br { bottom: 9%; right: 9%; }

    .arcade-btn {
      position: relative;
      width: 78%;
      height: 78%;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      outline: none;
      background:
        radial-gradient(circle at 50% 30%,
          #ff8a8a 0%, #f53b3b 42%, #d11d1d 70%, #9c1313 100%);
      box-shadow:
        0 20px 0 #6e0d0d,
        0 20px 0 3px #560a0a,
        inset 0 -10px 22px rgba(0,0,0,0.4),
        inset 0 14px 28px rgba(255,255,255,0.4);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.2s ease;
    }
    .arcade-btn .label {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.92);
      font-weight: 800;
      font-size: clamp(1.1rem, 3.4vw, 1.9rem);
      letter-spacing: 0.18em;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      pointer-events: none;
      user-select: none;
    }
    .arcade-btn:hover { filter: brightness(1.08); }
    .arcade-btn.pressed {
      transform: translateY(20px);
      box-shadow:
        0 2px 0 #6e0d0d,
        0 2px 0 3px #560a0a,
        inset 0 -5px 16px rgba(0,0,0,0.45),
        inset 0 10px 24px rgba(255,255,255,0.25);
    }
    /* Button breaks loose from its mounting and falls out of frame */
    .arcade-btn.falling {
      box-shadow:
        0 20px 0 #6e0d0d,
        0 20px 0 3px #560a0a;
      animation: breakLoose 0.95s cubic-bezier(0.45, 0.05, 0.95, 0.9) forwards;
    }
    @keyframes breakLoose {
      0%   { transform: translateY(20px) rotate(0deg); }
      12%  { transform: translateY(4px) rotate(-4deg); }
      100% { transform: translateY(140vh) rotate(32deg); }
    }
  </style>
</head>
<body>
  <!-- Video sits behind the curtains and is already playing when revealed -->
  <div class="video-container" id="videoContainer">
    <div id="player"></div>
    <div class="block-overlay" id="blockOverlay"></div>
  </div>

  <!-- Closed theater curtains -->
  <div class="curtains" id="curtains">
    <div class="valance"></div>
    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>
  </div>

  <!-- The enticement: giant red arcade button -->
  <div class="start-screen" id="startScreen">
    <div class="button-rig">
      <div class="mount" id="mount">
        <span class="bolt tl"></span>
        <span class="bolt tr"></span>
        <span class="bolt bl"></span>
        <span class="bolt br"></span>
      </div>
      <button class="arcade-btn" id="goBtn" aria-label="Claim prize">
        <span class="label">PUSH</span>
      </button>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var player;
    var clicked = false, videoPlaying = false, buttonDropped = false, opened = false, openScheduled = false;

    function onYouTubeIframeAPIReady() { /* API ready; player created on click */ }

    function openCurtains() {
      if (opened) return;
      opened = true;
      document.getElementById('curtains').classList.add('open');
      document.getElementById('startScreen').classList.add('gone');
      document.getElementById('blockOverlay').classList.add('active');
    }

    function maybeOpen() {
      if (openScheduled) return;
      if (buttonDropped && videoPlaying) {
        openScheduled = true;
        // Begin opening 0.25s after the video starts; CSS carries it to fully open at the 5s mark.
        setTimeout(openCurtains, 250);
      }
    }

    document.getElementById('goBtn').addEventListener('click', function () {
      if (clicked) return;
      clicked = true;

      var btn = this;
      btn.classList.add('pressed');

      // After it depresses, the button breaks loose and falls away.
      setTimeout(function () {
        btn.classList.remove('pressed');
        btn.classList.add('falling');
        document.getElementById('mount').style.opacity = '0';
      }, 240);

      // Build the player immediately so it's playing behind the curtains.
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: 'dQw4w9WgXcQ',
        playerVars: {
          'autoplay': 1,
          'controls': 1,
          'rel': 0,
          'modestbranding': 1,
          'fs': 1,
          'playsinline': 1
        },
        events: {
          'onReady': function (e) { e.target.playVideo(); },
          'onStateChange': function (e) {
            if (e.data === YT.PlayerState.PLAYING) {
              videoPlaying = true;
              maybeOpen();
            }
          }
        }
      });

      // Mark the button as dropped once it has cleared the frame.
      setTimeout(function () { buttonDropped = true; maybeOpen(); }, 1150);

      // Fallback: open the curtains even if the PLAYING event is delayed.
      setTimeout(function () { openCurtains(); }, 3500);
    });
  </script>
</body>
</html>
