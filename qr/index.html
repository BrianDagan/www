<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    /* Soothing dark-mode grayscale backdrop with a slow, gentle drift */
    body {
      background: linear-gradient(135deg, #1d1d1f 0%, #2c2c2f 25%, #3a3a3d 50%, #2c2c2f 75%, #1a1a1c 100%);
      background-size: 300% 300%;
      animation: drift 22s ease-in-out infinite;
    }
    @keyframes drift {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    /* ---------- Stage layers ---------- */
    .video-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 1;
      opacity: 0;
    }
    .video-container.visible { opacity: 1; }
    #player {
      width: 100%;
      height: 100%;
    }
    /* Diabolical: an invisible layer that swallows every click and hover,
       so the revealed video can't be paused and its controls never appear. */
    .block-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: transparent;
      pointer-events: none;
    }
    .block-overlay.active {
      pointer-events: auto;
    }

    /* ---------- Theater curtains (fade in, then part) ---------- */
    .curtains {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .curtains.visible { opacity: 1; }

    .valance {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background:
        repeating-linear-gradient(90deg,
          #5a0c0c 0px, #7e1414 26px, #9c1d1d 52px, #7e1414 78px, #5a0c0c 104px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
      border-bottom: 4px solid #d9a441;
      z-index: 3;
      will-change: transform;
      /* Starts after the side curtains, finishes at the same moment (2s + 3s = 5s) */
      transition: transform 3s cubic-bezier(0.55, 0, 0.3, 1) 2s;
    }
    .valance::after {
      content: '';
      position: absolute;
      bottom: -22px;
      left: 0;
      width: 100%;
      height: 22px;
      background:
        radial-gradient(circle at 20px -2px, #7e1414 16px, transparent 17px) repeat-x;
      background-size: 40px 22px;
    }
    .curtain {
      position: absolute;
      top: 0;
      height: 100%;
      width: 52%;
      background:
        repeating-linear-gradient(90deg,
          #4d0a0a 0px,
          #6e1010 22px,
          #9a1d1d 44px,
          #b32525 60px,
          #9a1d1d 76px,
          #6e1010 98px,
          #4d0a0a 120px);
      box-shadow: inset 0 0 120px rgba(0,0,0,0.7);
      transition: transform 5s cubic-bezier(0.7, 0, 0.25, 1);
      will-change: transform;
    }
    .curtain::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 30%,
        rgba(0,0,0,0) 70%, rgba(0,0,0,0.45) 100%);
    }
    .curtain-left  { left: 0;  transform-origin: left center; }
    .curtain-right { right: 0; transform-origin: right center; }
    .curtains.open .curtain-left  { transform: translateX(-102%); }
    .curtains.open .curtain-right { transform: translateX(102%); }
    .curtains.open .valance       { transform: translateY(-160%); }

    /* ---------- Start screen ---------- */
    .start-screen {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity 0.5s ease;
    }
    .start-screen.gone {
      opacity: 0;
      pointer-events: none;
    }

    /* ---------- Arcade button ---------- */
    .arcade-btn {
      position: relative;
      width: clamp(150px, 38vw, 240px);
      height: clamp(150px, 38vw, 240px);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      outline: none;
      /* Metallic bezel / housing ring */
      background:
        radial-gradient(circle at 50% 32%, #6f6f75 0%, #45454a 52%, #232327 100%);
      box-shadow:
        0 12px 26px rgba(0,0,0,0.55),
        inset 0 2px 3px rgba(255,255,255,0.28),
        inset 0 -5px 10px rgba(0,0,0,0.65);
      transition: filter 0.2s ease;
    }
    /* The convex, glossy button cap seated inside the bezel */
    .arcade-btn::before {
      content: '';
      position: absolute;
      inset: clamp(15px, 4vw, 24px);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 28%, #ff8f8f 0%, #f53b3b 40%, #cf1d1d 72%, #9c1313 100%);
      box-shadow:
        inset 0 12px 22px rgba(255,255,255,0.45),
        inset 0 -14px 24px rgba(0,0,0,0.45),
        0 7px 0 #7c1010;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .arcade-btn:hover { filter: brightness(1.07); }
    .arcade-btn:active::before {
      transform: translateY(6px);
      box-shadow:
        inset 0 10px 20px rgba(255,255,255,0.3),
        inset 0 -10px 20px rgba(0,0,0,0.5),
        0 1px 0 #7c1010;
    }
  </style>
</head>
<body>
  <!-- Video sits behind the curtains and is revealed already playing -->
  <div class="video-container" id="videoContainer">
    <div id="player"></div>
    <div class="block-overlay" id="blockOverlay"></div>
  </div>

  <!-- Theater curtains: fade in first, then part -->
  <div class="curtains" id="curtains">
    <div class="valance"></div>
    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>
  </div>

  <!-- The enticement: an unlabeled arcade button -->
  <div class="start-screen" id="startScreen">
    <button class="arcade-btn" id="goBtn" aria-label="Start"></button>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var player;
    var clicked = false;

    // Timing (ms)
    var CURTAIN_FADE = 800;   // curtains fade fully in
    var PLAY_DELAY   = 500;   // after curtains in, before video plays
    var OPEN_DELAY   = 750;   // after video plays, before curtains part

    function onYouTubeIframeAPIReady() { /* API ready; player created on click */ }

    document.getElementById('goBtn').addEventListener('click', function () {
      if (clicked) return;
      clicked = true;

      // Button simply fades out.
      document.getElementById('startScreen').classList.add('gone');

      // Curtains fade in over the grayscale backdrop.
      document.getElementById('curtains').classList.add('visible');

      // Start loading the video in the background (created within the user gesture).
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: 'dQw4w9WgXcQ',
        playerVars: {
          'autoplay': 0,
          'controls': 1,
          'rel': 0,
          'modestbranding': 1,
          'fs': 1,
          'playsinline': 1
        }
      });

      // Once curtains are fully faded in, place the (still hidden) video behind them.
      setTimeout(function () {
        document.getElementById('videoContainer').classList.add('visible');
      }, CURTAIN_FADE);

      // 0.5s after the curtains are fully faded in, start the video playing.
      setTimeout(function () {
        if (player && player.playVideo) player.playVideo();
      }, CURTAIN_FADE + PLAY_DELAY);

      // 0.75s after the video starts, part the curtains over 5 seconds.
      setTimeout(function () {
        document.getElementById('curtains').classList.add('open');
        document.getElementById('blockOverlay').classList.add('active');
      }, CURTAIN_FADE + PLAY_DELAY + OPEN_DELAY);
    });
  </script>
</body>
</html>
