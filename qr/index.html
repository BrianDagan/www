<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Push the button</title>
  <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👇</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    /* Subtle, slowly drifting rainbow backdrop */
    body {
      background: linear-gradient(120deg,
        #3a1d4d, #1d2e4d, #1d4d3e, #3a4d1d, #4d3a1d, #4d1d34, #3a1d4d);
      background-size: 400% 400%;
      animation: rainbow 30s ease-in-out infinite;
    }
    @keyframes rainbow {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    /* ---------- Stage layers ---------- */
    .video-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 1;
      opacity: 0;
    }
    .video-container.visible { opacity: 1; }
    #player {
      width: 100%;
      height: 100%;
    }
    /* Diabolical: an invisible layer that swallows every click and hover,
       so the revealed video can't be paused and its controls never appear. */
    .block-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: transparent;
      pointer-events: none;
    }
    .block-overlay.active {
      pointer-events: auto;
    }

    /* ---------- Theater curtains (fade in, then part) ---------- */
    .curtains {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .curtains.visible { opacity: 1; }

    .valance {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background:
        repeating-linear-gradient(90deg,
          #5a0c0c 0px, #7e1414 26px, #9c1d1d 52px, #7e1414 78px, #5a0c0c 104px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
      border-bottom: 4px solid #d9a441;
      z-index: 3;
      will-change: transform;
      /* Starts after the side curtains, finishes at the same moment (2s + 3s = 5s) */
      transition: transform 3s cubic-bezier(0.55, 0, 0.3, 1) 2s;
    }
    .valance::after {
      content: '';
      position: absolute;
      bottom: -22px;
      left: 0;
      width: 100%;
      height: 22px;
      background:
        radial-gradient(circle at 20px -2px, #7e1414 16px, transparent 17px) repeat-x;
      background-size: 40px 22px;
    }
    .curtain {
      position: absolute;
      top: 0;
      height: 100%;
      width: 52%;
      background:
        repeating-linear-gradient(90deg,
          #4d0a0a 0px,
          #6e1010 22px,
          #9a1d1d 44px,
          #b32525 60px,
          #9a1d1d 76px,
          #6e1010 98px,
          #4d0a0a 120px);
      box-shadow: inset 0 0 120px rgba(0,0,0,0.7);
      transition: transform 5s cubic-bezier(0.7, 0, 0.25, 1);
      will-change: transform;
    }
    .curtain::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 30%,
        rgba(0,0,0,0) 70%, rgba(0,0,0,0.45) 100%);
    }
    .curtain-left  { left: 0;  transform-origin: left center; }
    .curtain-right { right: 0; transform-origin: right center; }
    .curtains.open .curtain-left  { transform: translateX(-102%); }
    .curtains.open .curtain-right { transform: translateX(102%); }
    .curtains.open .valance       { transform: translateY(-160%); }

    /* ---------- Start screen ---------- */
    .start-screen {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity 0.5s ease;
    }
    .start-screen.gone {
      opacity: 0;
      pointer-events: none;
    }

    /* ---------- Arcade button ---------- */
    .arcade-btn {
      position: relative;
      width: clamp(150px, 38vw, 240px);
      height: clamp(150px, 38vw, 240px);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      outline: none;
      /* Brushed-metal arcade housing with a layered mounting collar */
      background:
        conic-gradient(from 90deg,
          #2a2a2e, #74747c, #38383d, #82828a, #2c2c30,
          #74747c, #38383d, #82828a, #2a2a2e);
      box-shadow:
        0 0 0 6px #141416,
        0 0 0 9px #2c2c31,
        0 16px 32px rgba(0,0,0,0.6),
        inset 0 3px 4px rgba(255,255,255,0.4),
        inset 0 -7px 14px rgba(0,0,0,0.75);
      transition: filter 0.2s ease;
    }
    /* The convex, glossy plunger cap, seated in the bezel with a dark gap ring.
       Bottom inset is larger than top so the cap (plus its side wall) reads as
       optically centered within the housing. */
    .arcade-btn::before {
      content: '';
      position: absolute;
      inset: clamp(13px, 3.4vw, 22px) clamp(17px, 4.2vw, 26px) clamp(21px, 5vw, 30px);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 30%, #ffffff 0%, #f4f4f4 38%, #dadada 70%, #b4b4b4 100%);
      box-shadow:
        0 0 0 4px rgba(0,0,0,0.6),
        inset 0 14px 26px rgba(255,255,255,0.7),
        inset 0 -16px 26px rgba(0,0,0,0.32),
        0 8px 0 #8f8f8f;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    /* Specular highlight blob for a glossy, molded-plastic arcade look */
    .arcade-btn::after {
      content: '';
      position: absolute;
      top: clamp(26px, 7vw, 44px);
      left: 50%;
      transform: translateX(-50%);
      width: 46%;
      height: 26%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center,
        rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
      filter: blur(2px);
      pointer-events: none;
      transition: transform 0.1s ease;
    }
    .arcade-btn:hover { filter: brightness(1.07); }
    .arcade-btn:active::before {
      transform: translateY(6px);
      box-shadow:
        0 0 0 4px rgba(0,0,0,0.6),
        inset 0 12px 22px rgba(255,255,255,0.55),
        inset 0 -12px 22px rgba(0,0,0,0.4),
        0 2px 0 #8f8f8f;
    }
    .arcade-btn:active::after {
      transform: translateX(-50%) translateY(6px);
    }
  </style>
</head>
<body>
  <!-- Video sits behind the curtains and is revealed already playing -->
  <div class="video-container" id="videoContainer">
    <div id="player"></div>
    <div class="block-overlay" id="blockOverlay"></div>
  </div>

  <!-- Theater curtains: fade in first, then part -->
  <div class="curtains" id="curtains">
    <div class="valance"></div>
    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>
  </div>

  <!-- The enticement: an unlabeled arcade button -->
  <div class="start-screen" id="startScreen">
    <button class="arcade-btn" id="goBtn" aria-label="Start"></button>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var player, playerReady = false, clicked = false;

    // Timing (ms)
    var REVEAL_AT = 800;    // place the hidden video behind the now-closed curtains
    var OPEN_AT   = 2050;   // begin parting the curtains (slow 5s open)

    // Pre-create the player on load so playback can begin *synchronously* inside the
    // tap handler — required for audio on mobile browsers (iOS Safari/Chrome only
    // permit unmuted playback that starts as a direct result of a user gesture).
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: 'dQw4w9WgXcQ',
        playerVars: {
          'autoplay': 0,
          'controls': 1,
          'rel': 0,
          'modestbranding': 1,
          'fs': 1,
          'playsinline': 1
        },
        events: {
          'onReady': function () { playerReady = true; }
        }
      });
    }

    document.getElementById('goBtn').addEventListener('click', function () {
      if (clicked) return;
      clicked = true;

      // Start playback NOW, within the user gesture, so sound is allowed on every
      // browser (desktop and mobile). The video stays invisible behind the curtains.
      if (player) {
        try { player.unMute(); } catch (e) {}
        try { player.playVideo(); } catch (e) {}
      }

      // Button simply fades out.
      document.getElementById('startScreen').classList.add('gone');

      // Once the button has faded out, switch the tab title and favicon.
      setTimeout(function () {
        document.title = 'Enjoy!';
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>" +
                  "<text y='.9em' font-size='90'>📽️</text></svg>";
        document.getElementById('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
      }, 500);

      // Curtains fade in over the rainbow backdrop.
      document.getElementById('curtains').classList.add('visible');

      // Once the curtains cover the screen, reveal the (until now hidden) video behind them.
      setTimeout(function () {
        document.getElementById('videoContainer').classList.add('visible');
      }, REVEAL_AT);

      // Part the curtains slowly (5s) once the player's startup overlay has auto-hidden.
      setTimeout(function () {
        document.getElementById('curtains').classList.add('open');
        document.getElementById('blockOverlay').classList.add('active');
      }, OPEN_AT);
    });
  </script>
</body>
</html>
